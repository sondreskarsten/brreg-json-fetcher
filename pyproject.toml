[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "brreg-json-fetcher"
version = "0.2.0"
description = "Track BRREG annual accounts and publish resumable data releases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["requests>=2.32,<3", "ijson>=3.3,<4", "pyarrow>=18,<26"]

[project.scripts]
brreg-fetch = "brreg_fetcher.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["brreg_fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

